<svg width="1400" height="900" viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#0f766e"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1400" height="900" fill="#f8fafc"/>
  <text x="700" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#0f172a">
    Communication Diagram EduShare
  </text>
  <text x="700" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#64748b">
    Screens, Providers, Services, Firebase, Firestore và PayOS
  </text>

  <g filter="url(#shadow)">
    <rect x="70" y="190" width="250" height="120" rx="18" fill="#ffffff" stroke="#ccfbf1" stroke-width="2"/>
    <text x="195" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#0f766e">Screens</text>
    <text x="195" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#475569">ProfileScreen, CartScreen</text>
    <text x="195" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#475569">ExpenseManagerScreen</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="540" width="250" height="110" rx="18" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/>
    <text x="195" y="582" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#2563eb">Providers</text>
    <text x="195" y="612" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#475569">AuthProvider</text>
    <text x="195" y="634" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#475569">CartProvider</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="535" y="330" width="330" height="140" rx="22" fill="#0f766e" stroke="#0d9488" stroke-width="2"/>
    <text x="700" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#ffffff">FirebaseDataService</text>
    <text x="700" y="412" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#ccfbf1">Điều phối nghiệp vụ</text>
    <text x="700" y="436" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#ccfbf1">Sản phẩm, đơn hàng, ví, chat, chi tiêu</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1040" y="170" width="260" height="120" rx="18" fill="#ffffff" stroke="#fde68a" stroke-width="2"/>
    <text x="1170" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#d97706">PayosService</text>
    <text x="1170" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#475569">Tạo QR</text>
    <text x="1170" y="266" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#475569">Kiểm tra thanh toán</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1040" y="560" width="260" height="120" rx="18" fill="#ffffff" stroke="#fecaca" stroke-width="2"/>
    <text x="1170" y="604" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#dc2626">PayOS API</text>
    <text x="1170" y="634" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#475569">Payment link</text>
    <text x="1170" y="656" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#475569">Trạng thái PAID/PENDING</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="535" y="690" width="330" height="120" rx="18" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
    <text x="700" y="734" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#4f46e5">Cloud Firestore</text>
    <text x="700" y="764" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#475569">Users, Products, Orders</text>
    <text x="700" y="786" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#475569">WalletRequests, ExpenseRecords</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="535" y="130" width="330" height="100" rx="18" fill="#ffffff" stroke="#bae6fd" stroke-width="2"/>
    <text x="700" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="#0284c7">Firebase Auth</text>
    <text x="700" y="202" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#475569">Xác thực tài khoản</text>
  </g>

  <path d="M320 245 C410 245 440 365 535 390" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="410" y="236" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0f766e">1. Gọi nghiệp vụ</text>

  <path d="M320 595 C430 595 440 455 535 430" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="390" y="578" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#2563eb">2. Trạng thái app</text>

  <path d="M700 330 L700 230" fill="none" stroke="#0284c7" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="718" y="284" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0284c7">3. Kiểm tra user</text>

  <path d="M700 470 L700 690" fill="none" stroke="#4f46e5" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="718" y="588" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#4f46e5">4. Đọc / ghi dữ liệu</text>

  <path d="M865 365 C960 340 980 245 1040 230" fill="none" stroke="#d97706" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="910" y="308" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#d97706">5. Tạo nạp ví</text>

  <path d="M1170 290 L1170 560" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1190" y="430" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#dc2626">6. Request PayOS</text>

  <path d="M1040 620 C955 610 930 490 865 430" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="912" y="578" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#dc2626">7. Trả trạng thái</text>

  <path d="M535 410 C430 410 390 306 320 282" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="384" y="364" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0f766e">8. Hiển thị kết quả</text>

  <rect x="170" y="735" width="310" height="92" rx="16" fill="#ecfdf5" stroke="#99f6e4" stroke-width="2"/>
  <text x="325" y="765" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="#0f766e">Luồng chính</text>
  <text x="325" y="792" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">Screens → FirebaseDataService → Firestore</text>
  <text x="325" y="814" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">Nạp ví: FirebaseDataService → PayosService → PayOS</text>
</svg>
